*{box-sizing:border-box;margin:0;padding:0}
.app{display:flex;height:100vh;min-height:620px;background:var(--color-background-tertiary)}

.student-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--border-radius-md);cursor:pointer;margin-bottom:2px;user-select:none}
.student-item:hover{background:var(--color-background-secondary)}
.student-item.active{background:#E6F1FB}
.student-item.drag-over{background:#DCEBF8;border:1px dashed #378ADD}
.student-item .drag-handle{width:18px;height:18px;display:flex;align-items:center;justify-content:center;color:var(--color-text-secondary);flex-shrink:0;cursor:grab}
.student-item .drag-handle:active{cursor:grabbing}
.student-item .delete-btn{width:24px;height:24px;background:transparent;border:none;color:var(--color-text-secondary);border-radius:6px;cursor:pointer;flex-shrink:0}
.student-item .delete-btn:hover{background:rgba(229,73,73,0.1);color:#E24B4A}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex-shrink:0}
.av-blue{background:#E6F1FB;color:#0C447C}
.av-teal{background:#E1F5EE;color:#085041}
.av-coral{background:#FAECE7;color:#712B13}
.av-purple{background:#EEEDFE;color:#3C3489}
.student-info{flex:1;min-width:0}
.student-name{font-size:13px;font-weight:500;color:var(--color-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.student-goal{font-size:11px;color:var(--color-text-secondary)}
.add-btn{margin:8px;padding:8px;border-radius:var(--border-radius-md);border:0.5px dashed var(--color-border-secondary);background:none;cursor:pointer;font-size:12px;color:var(--color-text-secondary);display:flex;align-items:center;justify-content:center;gap:6px;width:calc(100% - 16px)}
.add-btn:hover{background:var(--color-background-secondary);color:var(--color-text-primary)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--color-background-primary);border-bottom:0.5px solid var(--color-border-tertiary);padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
.topbar-left{display:flex;align-items:center;gap:10px}
.av-lg{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;flex-shrink:0}
.student-name-lg{font-size:15px;font-weight:500;color:var(--color-text-primary)}
.student-meta{font-size:11px;color:var(--color-text-secondary);margin-top:1px}
.topbar-right{display:flex;align-items:center;gap:6px}
.tabs{display:flex;gap:3px}
.tab{padding:5px 12px;border-radius:var(--border-radius-md);font-size:12px;cursor:pointer;border:none;background:none;color:var(--color-text-secondary);font-family:var(--font-sans)}
.tab.active{background:var(--color-background-secondary);color:var(--color-text-primary);font-weight:500}
.tab:hover:not(.active){background:var(--color-background-secondary)}
.content{flex:1;overflow-y:auto;padding:14px 16px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-title{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.action-btn{padding:5px 10px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);cursor:pointer;font-size:11px;color:var(--color-text-secondary);display:flex;align-items:center;gap:5px;font-family:var(--font-sans)}

.change-down{color:#993C1D}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:12px 14px;margin-bottom:10px}

.workout-date{font-size:12px;font-weight:500;color:var(--color-text-primary)}

.badge-amber{background:#FAEEDA;color:#854F0B}
.exercise-table{width:100%;font-size:11px;border-collapse:collapse;table-layout:fixed}

.exercise-table tr:last-child td{border-bottom:none}
.muscle-tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px}
.tag-chest{background:#FAECE7;color:#712B13}
.tag-back{background:#E1F5EE;color:#085041}
.tag-legs{background:#EEEDFE;color:#3C3489}
.tag-shoulder{background:#E6F1FB;color:#0C447C}

.note-box{background:var(--color-background-secondary);padding:8px 10px;font-size:11px;color:var(--color-text-secondary);margin-top:8px;border-left:2px solid #378ADD;border-radius:0 var(--border-radius-md) var(--border-radius-md) 0}

function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(()=>t.classList.remove('show'), 2800);
}
function setDbStatus(s) {
  const dot = document.getElementById('dbDot');
  const txt = document.getElementById('dbStatus');
  if(s==='saving'){dot.className='db-dot saving';txt.textContent='儲存中...';}
  else if(s==='ok'){dot.className='db-dot';txt.textContent='資料庫已連線';}
  else{dot.className='db-dot error';txt.textContent='儲存失敗';}
}

  try {
    const r1 = await window.storage.get('fittrack:students');
    const r2 = await window.storage.get('fittrack:workouts');
    const r3 = await window.storage.get('fittrack:body');
    const r4 = await window.storage.get('fittrack:plans');
    state.students = r1 ? JSON.parse(r1.value) : DEFAULT_STUDENTS;
    state.workouts = r2 ? JSON.parse(r2.value) : DEFAULT_WORKOUTS;
    state.body = r3 ? JSON.parse(r3.value) : DEFAULT_BODY;
    state.plans = r4 ? JSON.parse(r4.value) : DEFAULT_PLANS;
  } catch(e) {
    state.students = DEFAULT_STUDENTS;
    state.workouts = DEFAULT_WORKOUTS;
    state.body = DEFAULT_BODY;
    state.plans = DEFAULT_PLANS;
  }
  if(!state.currentId && state.students.length) state.currentId = state.students[0].id;
  renderSidebar();
  updateTopbar();
  renderTab(state.tab);
}

async function saveToDB(key, data) {
  setDbStatus('saving');
  try {
    await window.storage.set(`fittrack:${key}`, JSON.stringify(data));
    setDbStatus('ok');
    return true;
  } catch(e) {
    setDbStatus('error');
    return false;
  }
}

let dragSourceId = null;

function renderSidebar() {
  const list = document.getElementById('studentList');
  document.getElementById('studentCount').textContent = `學員名單 (${state.students.length})`;
  list.innerHTML = state.students.map(s=>`
    <div class="student-item ${s.id===state.currentId?'active':''}" draggable="true" data-student-id="${s.id}"
         ondragstart="dragStart(event)" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropItem(event)"
         onclick="selectStudent('${s.id}')">
      <button class="drag-handle" aria-label="拖曳調整順序" title="拖曳調整順序"><i class="ti ti-arrows-sort"></i></button>
      <div class="avatar ${s.avClass}">${s.initials}</div>
      <div class="student-info">
        <div class="student-name">${s.name}</div>
        <div class="student-goal">${s.goal}</div>
      </div>
      <button class="delete-btn" onclick="deleteStudent('${s.id}', event)" aria-label="刪除學員" title="刪除學員"><i class="ti ti-trash"></i></button>
    </div>
  `).join('');
}

function dragStart(event) {
  dragSourceId = event.currentTarget.dataset.studentId;
  event.dataTransfer.effectAllowed = 'move';
  event.dataTransfer.setData('text/plain', dragSourceId);
}

function dragOver(event) {
  event.preventDefault();
  event.currentTarget.classList.add('drag-over');
}

function dragLeave(event) {
  event.currentTarget.classList.remove('drag-over');
}

function dropItem(event) {
  event.preventDefault();
  event.currentTarget.classList.remove('drag-over');
  const targetId = event.currentTarget.dataset.studentId;
  const sourceId = dragSourceId || event.dataTransfer.getData('text/plain');
  if(!sourceId || sourceId === targetId) return;
  reorderStudents(sourceId, targetId);
}

function reorderStudents(sourceId, targetId) {
  const sourceIndex = state.students.findIndex(s=>s.id===sourceId);
  const targetIndex = state.students.findIndex(s=>s.id===targetId);
  if(sourceIndex === -1 || targetIndex === -1) return;
  const [moved] = state.students.splice(sourceIndex, 1);
  state.students.splice(targetIndex, 0, moved);
  saveToDB('students', state.students);
  renderSidebar();
}

function deleteStudent(id, event) {
  event.stopPropagation();
  const student = state.students.find(s=>s.id===id);
  if(!student) return;
  if(!confirm(`確定要刪除 ${student.name}？此操作無法還原。`)) return;
  state.students = state.students.filter(s=>s.id!==id);
  delete state.workouts[id];
  delete state.body[id];
  delete state.plans[id];
  if(state.currentId === id) {
    state.currentId = state.students.length ? state.students[0].id : null;
  }
  saveAllData();
  renderSidebar();
  updateTopbar();
  renderTab(state.tab);
  showToast(`${student.name} 已刪除`);
}

function deleteCurrentStudent() {
  if(!state.currentId) return;
  deleteStudent(state.currentId, {stopPropagation:()=>{}});
}

function updateTopbar() {
  const s = getCurrentStudent();
  if(!s) return;
  const av = document.getElementById('topAvatar');
  av.textContent = s.initials;
  av.className = `av-lg ${s.avClass}`;
  document.getElementById('topName').textContent = s.name;
  document.getElementById('topMeta').textContent = `${s.age}歲 · ${s.gender} · 加入 ${s.since} · 目標：${s.goal}`;
}

function getCurrentStudent() { return state.students.find(s=>s.id===state.currentId); }

function selectStudent(id) {
  state.currentId = id;
  renderSidebar();
  updateTopbar();
  renderTab(state.tab);
}

function switchTab(tab, el) {
  state.tab = tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderTab(tab);
}

function renderTab(tab) {
  const c = document.getElementById('tabContent');
  if(tab==='overview') c.innerHTML = renderOverview();
  else if(tab==='workouts') c.innerHTML = renderWorkouts();
  else if(tab==='body') c.innerHTML = renderBody();
  else if(tab==='plan') c.innerHTML = renderPlan();
}

function muscleTag(m) {
  const map={chest:'胸',back:'背',legs:'腿',shoulder:'肩',arms:'手臂',core:'核心'};
  const cls={chest:'tag-chest',back:'tag-back',legs:'tag-legs',shoulder:'tag-shoulder',arms:'tag-arms',core:'tag-core'};
  return `<span class="muscle-tag ${cls[m]||'tag-chest'}">${map[m]||m}</span>`;
}

async function saveWorkout() {
  const sid = state.currentId;
  const date = document.getElementById('wDate').value;
  const type = document.getElementById('wType').value;
  const exName = document.getElementById('wEx').value;
  const muscle = document.getElementById('wMuscle').value;
  const sets = parseInt(document.getElementById('wSets').value)||3;
  const reps = document.getElementById('wReps').value||'10';
  const weight = document.getElementById('wWeight').value||'-';
  const note = document.getElementById('wNote').value||'';
  if(!date||!type||!exName){showToast('請填寫日期、類型和動作名稱','info');return;}
  const formatted = date.replace(/-/g,'/');
  if(!state.workouts[sid]) state.workouts[sid]=[];
  state.workouts[sid].unshift({
    id:'w'+Date.now(),date:formatted,type,status:'完成',
    exercises:[{name:exName,muscle,sets,reps,weight}],note
  });
  const ok = await saveToDB('workouts', state.workouts);
  if(ok) showToast(`訓練記錄已儲存至資料庫`);
  renderTab('workouts');
}

async function deleteWorkout(sid, idx) {
  if(!confirm('確定刪除此訓練記錄？')) return;
  state.workouts[sid].splice(idx,1);
  const ok = await saveToDB('workouts', state.workouts);
  if(ok) showToast('記錄已刪除');
  renderTab('workouts');
}

async function saveAllData() {
  setDbStatus('saving');
  try {
    await window.storage.set('fittrack:students', JSON.stringify(state.students));
    await window.storage.set('fittrack:workouts', JSON.stringify(state.workouts));
    await window.storage.set('fittrack:body', JSON.stringify(state.body));
    await window.storage.set('fittrack:plans', JSON.stringify(state.plans));
    setDbStatus('ok');
    showToast('所有資料已儲存至資料庫');
  } catch(e) {
    setDbStatus('error');
    showToast('儲存失敗，請稍後再試','info');
  }
}

function exportPDF() {
  const s = getCurrentStudent();
  if(!s){showToast('請先選擇學員','info');return;}
  const btn = document.getElementById('pdfBtn');
  btn.innerHTML = '<i class="ti ti-loader" aria-hidden="true"></i> 產生中...';
  btn.disabled = true;

  setTimeout(()=>{
    try {
      const {jsPDF} = window.jspdf;
      const doc = new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
      const pw = doc.internal.pageSize.getWidth();
      const ph = doc.internal.pageSize.getHeight();
      const today = new Date().toLocaleDateString('zh-TW');
      let y = 15;

      doc.setFillColor(24,95,165);
      doc.rect(0,0,pw,22,'F');
      doc.setTextColor(255,255,255);
      doc.setFontSize(14);doc.setFont('helvetica','bold');
      doc.text('FitTrack Pro', 14, 13);
      doc.setFontSize(9);doc.setFont('helvetica','normal');
      doc.text('Fitness Training Report', 14, 19);
      doc.text(`Generated: ${today}`, pw-14, 16, {align:'right'});
      y = 30;

      doc.setTextColor(30,30,30);
      doc.setFontSize(13);doc.setFont('helvetica','bold');
      doc.text(s.name, 14, y);
      doc.setFontSize(9);doc.setFont('helvetica','normal');
      doc.setTextColor(100,100,100);
      doc.text(`Age ${s.age}  |  ${s.gender}  |  Since ${s.since}  |  Goal: ${s.goal}`, 14, y+6);
      y += 14;

      doc.setFillColor(245,247,250);
      doc.roundedRect(12, y, pw-24, 22, 2, 2, 'F');
      const metrics = [
        ['Body Weight', `${s.weight} kg`],
        ['Target', `${s.targetWeight} kg`],
        ['BMI', `${s.bmi}`],
        ['Body Fat', `${s.bodyFat}%`],
        ['Total Sessions', `${s.sessions}`],
        ['This Month', `${s.monthSessions}`],
      ];
      const mw = (pw-28)/metrics.length;
      metrics.forEach(([l,v],i)=>{
        const mx = 14 + i*mw + mw/2;
        doc.setFontSize(7);doc.setTextColor(120,120,120);doc.setFont('helvetica','normal');
        doc.text(l, mx, y+8, {align:'center'});
        doc.setFontSize(11);doc.setTextColor(24,95,165);doc.setFont('helvetica','bold');
        doc.text(v, mx, y+16, {align:'center'});
      });
      y += 28;

      const ws = state.workouts[s.id]||[];
      if(ws.length) {
        doc.setFontSize(11);doc.setFont('helvetica','bold');doc.setTextColor(30,30,30);
        doc.text('Training Records', 14, y); y+=6;
        const allRows = [];
        ws.forEach(w=>{
          w.exercises.forEach((e,ei)=>{
            allRows.push([ei===0?`${w.date}\n${w.type}`:'',e.name,e.sets,e.reps,e.weight,ei===0?w.note:'']);
          });
        });
        doc.autoTable({
          startY:y,
          head:[['Date / Type','Exercise','Sets','Reps','Weight','Coach Notes']],
          body:allRows,
          styles:{fontSize:8,cellPadding:3},
          headStyles:{fillColor:[24,95,165],textColor:255,fontStyle:'bold',fontSize:8},
          alternateRowStyles:{fillColor:[248,250,252]},
          columnStyles:{0:{cellWidth:32},1:{cellWidth:32},2:{cellWidth:12},3:{cellWidth:18},4:{cellWidth:20},5:{cellWidth:'auto'}},
          margin:{left:12,right:12},
        });
        y = doc.lastAutoTable.finalY+8;
      }

      const plan = state.plans[s.id]||[];
      const planDays = plan.filter(d=>d.exercises.length>0);
      if(planDays.length) {
        if(y > ph-60){doc.addPage();y=15;}
        doc.setFontSize(11);doc.setFont('helvetica','bold');doc.setTextColor(30,30,30);
        doc.text('Weekly Training Plan', 14, y); y+=6;
        doc.autoTable({
          startY:y,
          head:[['Day','Type','Exercises']],
          body:planDays.map(d=>[d.day, d.type, d.exercises.join(', ')]),
          styles:{fontSize:8,cellPadding:3},
          headStyles:{fillColor:[24,95,165],textColor:255,fontStyle:'bold',fontSize:8},
          alternateRowStyles:{fillColor:[248,250,252]},
          columnStyles:{0:{cellWidth:18},1:{cellWidth:26},2:{cellWidth:'auto'}},
          margin:{left:12,right:12},
        });
        y = doc.lastAutoTable.finalY+8;
      }

      const bd = state.body[s.id];
      if(bd&&bd.conditions.length) {
        if(y > ph-50){doc.addPage();y=15;}
        doc.setFontSize(11);doc.setFont('helvetica','bold');doc.setTextColor(30,30,30);
        doc.text('Physical Condition Assessment', 14, y); y+=6;
        doc.autoTable({
          startY:y,
          head:[['Assessment Item','Status']],
          body:bd.conditions.map(c=>[c.label, c.status]),
          styles:{fontSize:8,cellPadding:3},
          headStyles:{fillColor:[24,95,165],textColor:255,fontStyle:'bold',fontSize:8},
          alternateRowStyles:{fillColor:[248,250,252]},
          columnStyles:{0:{cellWidth:50}},
          margin:{left:12,right:12},
        });
      }

      const totalPages = doc.internal.getNumberOfPages();
      for(let i=1;i<=totalPages;i++){
        doc.setPage(i);
        doc.setFontSize(7);doc.setTextColor(160,160,160);doc.setFont('helvetica','normal');
        doc.text(`FitTrack Pro  |  ${s.name}  |  Page ${i} / ${totalPages}`, pw/2, ph-6, {align:'center'});
      }

      doc.save(`FitTrack_${s.name}_${today.replace(/\//g,'-')}.pdf`);
      showToast(`PDF 報告已匯出：${s.name}`);
    } catch(err) {
      showToast('PDF 產生失敗，請稍後再試','info');
    }
    btn.innerHTML = '<i class="ti ti-file-type-pdf" aria-hidden="true"></i> 匯出 PDF';
    btn.disabled = false;
  }, 100);
}

loadFromDB();
</script>
